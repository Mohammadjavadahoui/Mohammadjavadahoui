<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Mohammad Javad">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05070D"/><stop offset="0.55" stop-color="#0B1226"/><stop offset="1" stop-color="#150F2E"/>
  </linearGradient>
  <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#60A5FA"><animate attributeName="stop-color" values="#60A5FA;#A78BFA;#22D3EE;#60A5FA" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="0.5" stop-color="#A78BFA"><animate attributeName="stop-color" values="#A78BFA;#22D3EE;#60A5FA;#A78BFA" dur="8s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#60A5FA;#A78BFA;#22D3EE" dur="8s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#3B82F6" stroke-opacity="0.08"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="round"><rect width="1000" height="280" rx="24"/></clipPath>
  <clipPath id="typ"><rect x="284" y="150" height="40" width="0">
    <animate attributeName="width" values="0;440;440;0" keyTimes="0;0.45;0.92;1" dur="9s" repeatCount="indefinite"/>
  </rect></clipPath>
</defs>
<g clip-path="url(#round)">
  <rect width="1000" height="280" fill="url(#bg)"/>
  <rect width="1000" height="280" fill="url(#grid)"/>
  <circle cx="170" cy="70" r="110" fill="#3B82F6" opacity="0.38" filter="url(#blur)">
    <animateTransform attributeName="transform" type="translate" values="0 0;50 25;0 0" dur="9s" repeatCount="indefinite"/></circle>
  <circle cx="830" cy="215" r="130" fill="#8B5CF6" opacity="0.38" filter="url(#blur)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-60 -20;0 0" dur="11s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="30" r="70" fill="#06B6D4" opacity="0.28" filter="url(#blur)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-40 30;0 0" dur="10s" repeatCount="indefinite"/></circle>
  <text x="70" y="190" font-family="'Fira Code','JetBrains Mono','Cascadia Code','Consolas','Courier New',monospace" font-size="150" fill="#60A5FA" opacity="0.06">{ }</text>
  <text x="640" y="120" font-family="'Fira Code','JetBrains Mono','Cascadia Code','Consolas','Courier New',monospace" font-size="150" fill="#A78BFA" opacity="0.06">&lt;/&gt;</text>
  <g fill="#fff">
    <circle cx="120" cy="40" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="60" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="4s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="235" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="150" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="5s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="215" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
  </g>
  <text x="500" y="122" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','Cascadia Code','Consolas','Courier New',monospace" font-size="62" font-weight="800" letter-spacing="3"
        fill="url(#ttl)" filter="url(#glow)">MOHAMMAD JAVAD</text>
  <g clip-path="url(#typ)">
    <text x="284" y="178" font-family="'Fira Code','JetBrains Mono','Cascadia Code','Consolas','Courier New',monospace" font-size="20" fill="#CBD5E1" textLength="432" lengthAdjust="spacingAndGlyphs">Python Developer · Bots · Dashboards</text>
  </g>
  <rect x="284" y="160" width="2.5" height="24" fill="#22D3EE">
    <animate attributeName="x" values="284;716;716;284" keyTimes="0;0.45;0.92;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="244" text-anchor="middle" font-family="'Fira Code','JetBrains Mono','Cascadia Code','Consolas','Courier New',monospace" font-size="13" letter-spacing="4" fill="#64748B">FLET  ◆  DJANGO  ◆  SELENIUM  ◆  AUTOMATION</text>
</g>
<rect x="1.5" y="1.5" width="997" height="277" rx="23" fill="none" stroke="url(#ttl)" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="6 10">
  <animate attributeName="stroke-dashoffset" values="0;-160" dur="6s" repeatCount="indefinite"/>
</rect>
</svg>